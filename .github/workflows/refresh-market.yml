name: Refresh market snapshot

on:
  schedule:
    - cron: '*/5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect latest market and news data
        run: node scripts/update-snapshot.mjs
      - name: Publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/market.json
          if git diff --cached --quiet; then
            echo 'No data changes to publish.'
          else
            git commit -m 'Refresh market and news snapshot'
            git push
          fi

